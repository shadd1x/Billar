<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    
    <title>🎱 Billar Control VIP</title>
    <meta name="theme-color" content="#0a0a0a">
    
    <!-- iOS Optimizations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Billar VIP">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="format-detection" content="telephone=no">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon-192.png" type="image/png">

    <style>
        *{ box-sizing:border-box; }
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:linear-gradient(135deg,#0a0a0a,#1a1a1a);
            color:#fff;
            margin:0;
            padding:10px;
        }
        .container{ max-width:620px; margin:auto; }
        .header{ text-align:center; margin:20px 0 15px 0; }
        .bola8{ font-size:92px; line-height:1; margin-bottom:8px; text-shadow: 0 0 30px #fff, 0 0 60px #e91e63; }
        .section{
            background:#1f1f1f;
            padding:18px;
            margin:15px 0;
            border-radius:16px;
        }
        button{
            background:#e91e63;
            color:white;
            border:none;
            padding:14px;
            margin:8px 4px;
            border-radius:12px;
            font-size:17px;
            font-weight:600;
            width:100%;
            cursor:pointer;
        }
        button:active{ transform:scale(.98); }
        .btn-small { padding: 10px 12px; font-size: 15px; margin: 4px; flex: 1; }
        .preset-container { display: flex; gap: 8px; margin-top: 10px; }
        .personalizado-inputs { display: flex; gap: 12px; margin: 15px 0; }
        .personalizado-inputs div { flex: 1; }
        input, select{
            width:100%;
            padding:14px;
            margin:8px 0;
            border:none;
            border-radius:12px;
            background:#333;
            color:white;
            font-size:17px;
        }
        .btn-rojo{ background:#f44336; }
        .btn-verde{ background:#4caf50; }
        .btn-azul{ background:#2196f3; }
        .btn-naranja{ background:#ff9800; }
        .btn-gris{ background:#666; }
        .btn-efectivo{ background:#4caf50; }
        .btn-qr{ background:#2196f3; }
        .btn-preset{ background:#9c27b0; }

        .mesa{
            background:#1f1f1f;
            padding:16px;
            margin:12px 0;
            border-radius:14px;
            cursor:pointer;
            border:3px solid transparent;
            transition:all .4s;
        }
        .activa{ background:#2e7d32; border:3px solid #4caf50; }
        .vip{ border:3px solid #8e24aa; }
        .vip.activa{
            background:#311b92;
            border:3px solid #d500f9;
            box-shadow: 0 0 15px #d500f9, 0 0 30px rgba(213,0,249,.4);
        }
        .alarma{ animation:alarmaVIP 700ms infinite alternate; }
        @keyframes alarmaVIP{
            from{ transform:scale(1); }
            to{ transform:scale(1.03); background:#6a1b9a; border-color:#e040fb; box-shadow: 0 0 20px #e040fb; }
        }
        .tiempo-restante{
            font-size:19px;
            font-weight:bold;
            color:#ffeb3b;
        }
        .modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.95);
            z-index:100;
        }
        .modal-content{
            background:#222;
            margin:8% auto;
            padding:25px;
            width:90%;
            max-width:460px;
            border-radius:16px;
            max-height:90vh;
            overflow-y:auto;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="bola8">🎱</div>
        <h1>BILLAR CONTROL VIP</h1>
        <p style="color:#aaa;">La Paz • Bolivia</p>
    </div>

    <!-- LOGIN -->
    <div id="loginScreen">
        <div class="section">
            <h2>🔐 Iniciar Sesión</h2>
            <input type="password" id="password" placeholder="Contraseña" onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()">Entrar</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="mainApp" style="display:none;">
        <div style="text-align:right; margin-bottom:10px;">
            <button onclick="cerrarSesion()" class="btn-gris" style="width:auto; padding:8px 16px; font-size:15px;">
                🚪 Cerrar Sesión
            </button>
        </div>

        <!-- CONFIG -->
        <div class="section">
            <h2>⚙️ Configuración</h2>
            <label>Precio Mesa Normal (Bs/Hora)</label>
            <input type="number" id="precioHora" value="50" step="0.01">
            <label>Precio Mesa VIP (Bs/Hora)</label>
            <input type="number" id="precioHoraVIP" value="80" step="0.01">
            <select id="modoCobro">
                <option value="entero">Cobrar sin decimales</option>
                <option value="decimal">Cobrar con decimales</option>
            </select>
            <button onclick="guardarConfig()">Guardar Configuración</button>
        </div>

        <!-- AGREGAR MESA -->
        <div class="section">
            <h2>➕ Agregar Mesa</h2>
            <input type="text" id="nombreMesa" placeholder="Nombre de la mesa">
            <select id="tipoMesa">
                <option value="normal">Mesa Normal</option>
                <option value="vip">Mesa VIP</option>
            </select>
            <button onclick="agregarMesa()">+ Agregar Mesa</button>
        </div>

        <!-- LISTA DE MESAS -->
        <div class="section">
            <h2>🎱 Mesas</h2>
            <div id="listaMesas"></div>
        </div>

        <div style="display:flex; gap:8px;">
            <button onclick="mostrarHistorial()" class="btn-azul">📋 Historial</button>
            <button onclick="exportarControlDelDia()" class="btn-naranja">📅 Control del Día</button>
        </div>
    </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitulo"></h2>
        <div id="contenidoModal"></div>
        <button onclick="cerrarModal()" class="btn-gris" style="margin-top:15px;">Cerrar</button>
    </div>
</div>

<script>
// ==================== CONTRASEÑA OFUSCADA ====================
const HASH_CORRECTO = "c89fe5b7a007332d70f5e983d19b73c176c33eb478cff948466163aeff9e3016";

async function hashPassword(pw) {
    const encoder = new TextEncoder();
    const data = encoder.encode(pw);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function login(){
    const pass = document.getElementById('password').value.trim();
    if(pass === "") {
        alert("❌ Ingresa la contraseña");
        return;
    }
    const hashIngresado = await hashPassword(pass);
    if(hashIngresado === HASH_CORRECTO){
        document.getElementById('loginScreen').style.display='none';
        document.getElementById('mainApp').style.display='block';
        cargarDatos();
        renderMesas();
    } else {
        alert("❌ Contraseña incorrecta");
        document.getElementById('password').value = '';
    }
}

// ==================== VARIABLES ====================
let precioPorHora = 50;
let precioPorHoraVIP = 80;
let usarDecimales = false;
let mesas = [];
let historial = [];
let alarmAudio = null;

// ==================== AUDIO ALARMA ====================
function initAudio() {
    if (!alarmAudio) {
        alarmAudio = new Audio('alarm-bell.mp3');
        alarmAudio.loop = true;
        alarmAudio.preload = "auto";
    }
}

async function playAlarm() {
    initAudio();
    try { if (alarmAudio.paused) await alarmAudio.play(); } catch(e){}
    if (navigator.vibrate) navigator.vibrate([600, 300, 600, 300, 600]);
}

function stopAlarm() {
    if (alarmAudio) {
        alarmAudio.pause();
        alarmAudio.currentTime = 0;
    }
}

// ==================== FUNCIONES PRINCIPALES ====================
function cerrarSesion(){
    if(confirm("¿Cerrar sesión?")){
        document.getElementById('mainApp').style.display='none';
        document.getElementById('loginScreen').style.display='block';
        document.getElementById('password').value = '';
    }
}

function cargarDatos(){
    precioPorHora = parseFloat(localStorage.getItem('precioHora')) || 50;
    precioPorHoraVIP = parseFloat(localStorage.getItem('precioHoraVIP')) || 80;
    usarDecimales = JSON.parse(localStorage.getItem('usarDecimales')) || false;
    mesas = JSON.parse(localStorage.getItem('mesasBillar')) || [];
    historial = JSON.parse(localStorage.getItem('historialBillar')) || [];

    document.getElementById('precioHora').value = precioPorHora;
    document.getElementById('precioHoraVIP').value = precioPorHoraVIP;
    document.getElementById('modoCobro').value = usarDecimales ? 'decimal' : 'entero';
}

function guardarDatos(){
    localStorage.setItem('mesasBillar', JSON.stringify(mesas));
    localStorage.setItem('historialBillar', JSON.stringify(historial));
}

function formatoBs(monto){
    return usarDecimales ? parseFloat(monto).toFixed(2) : Math.round(monto);
}

function calcularMonto(horas, mesa = null){
    let precio = precioPorHora;
    if(mesa && mesa.tipoMesa === 'vip') precio = precioPorHoraVIP;
    const monto = horas * precio;
    return usarDecimales ? parseFloat(monto.toFixed(2)) : Math.round(monto);
}

function calcularTiempoJugado(inicio){
    const diff = Date.now() - inicio;
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000)/60000);
    const s = Math.floor((diff % 60000)/1000);
    return {
        texto: `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`,
        horasDecimal: diff / 3600000
    };
}

// ==================== RENDER MESAS ====================
function renderMesas(){
    const lista = document.getElementById('listaMesas');
    lista.innerHTML = '';

    if(mesas.length === 0){
        lista.innerHTML = `<p style="color:#888;text-align:center;padding:20px;">No hay mesas registradas</p>`;
        return;
    }

    mesas.forEach((mesa, index) => {
        const div = document.createElement('div');
        div.className = `mesa ${mesa.estado==='ocupada' ? 'activa' : ''} ${mesa.tipoMesa==='vip' ? 'vip' : ''}`;

        if(mesa.tipo==='tiempo' && mesa.fin && Date.now() >= mesa.fin){
            div.classList.add('alarma');
        }

        let vipLabel = mesa.tipoMesa==='vip' ? `<span style="color:#d500f9;">🌟 VIP</span>` : '';
        let html = `<strong>${mesa.nombre}</strong> ${vipLabel}<br>`;

        if(mesa.estado === 'ocupada'){
            if(mesa.tipo === 'tiempo' && mesa.fin){
                const diff = mesa.fin - Date.now();
                const tiempo = diff > 0 
                    ? `${Math.floor(diff/3600000).toString().padStart(2,'0')}:${Math.floor((diff%3600000)/60000).toString().padStart(2,'0')}:${Math.floor((diff%60000)/1000).toString().padStart(2,'0')}`
                    : "00:00:00";
                html += `<span class="tiempo-restante">⏳ ${tiempo}</span>`;
            } else if(mesa.tipo === 'ilimitado'){
                const t = calcularTiempoJugado(mesa.inicio);
                html += `<span class="tiempo-restante">▶️ ${t.texto}</span>`;
            }
        } else {
            html += `<small>Libre</small>`;
        }

        html += `<br><button onclick="event.stopImmediatePropagation(); eliminarMesa(${index});" class="btn-rojo" style="width:auto;padding:8px 12px;margin-top:8px;font-size:14px;">Eliminar</button>`;

        div.innerHTML = html;
        div.addEventListener('click', () => abrirModalMesa(index));
        lista.appendChild(div);
    });
}

// ==================== FUNCIONES DEL MODAL ====================
function abrirModalMesa(index){
    const mesa = mesas[index];
    document.getElementById('modalTitulo').textContent = mesa.nombre;
    let html = '';

    if(mesa.estado === 'ocupada'){
        if(mesa.tipo === 'ilimitado'){
            const tiempo = calcularTiempoJugado(mesa.inicio);
            const total = calcularMonto(tiempo.horasDecimal, mesa);
            html = `
                <p><strong>Tiempo:</strong> ${tiempo.texto}</p>
                <p><strong>Sugerido:</strong> ${formatoBs(total)} Bs</p>
                <button onclick="cobrarIlimitado(${index},'Efectivo')" class="btn-efectivo">💵 Efectivo</button>
                <button onclick="cobrarIlimitado(${index},'QR')" class="btn-qr">📱 QR</button>
            `;
        } else {
            html = `<button onclick="finalizarMesa(${index})" class="btn-verde">✅ Finalizar Mesa</button>`;
        }
    } else {
        html = `
            <h3>Tiempo Fijo</h3>
            <div class="preset-container">
                <button onclick="iniciarPreset(${index},30)" class="btn-preset btn-small">30 min</button>
                <button onclick="iniciarPreset(${index},60)" class="btn-preset btn-small">1 hora</button>
                <button onclick="iniciarPreset(${index},120)" class="btn-preset btn-small">2 horas</button>
            </div>
            <button onclick="mostrarPersonalizado(${index})" style="margin-top:12px;">⏱️ Tiempo Personalizado</button>
            <button onclick="iniciarIlimitado(${index})" style="margin-top:8px;">♾️ Tiempo Ilimitado</button>
        `;
    }
    document.getElementById('contenidoModal').innerHTML = html;
    document.getElementById('modal').style.display = 'block';
}

function mostrarPersonalizado(index){
    const html = `
        <h3>⏱️ Tiempo Personalizado</h3>
        <div class="personalizado-inputs">
            <div><label>Horas</label><input type="number" id="horasLibre" value="0" min="0"></div>
            <div><label>Minutos</label><input type="number" id="minutosLibre" value="30" min="0" max="59"></div>
        </div>
        <button onclick="iniciarPersonalizado(${index})" class="btn-verde">Iniciar Tiempo</button>
    `;
    document.getElementById('contenidoModal').innerHTML = html;
}

function iniciarPersonalizado(index){
    const horas = parseFloat(document.getElementById('horasLibre').value) || 0;
    const minutos = parseFloat(document.getElementById('minutosLibre').value) || 0;
    const totalMinutos = horas*60 + minutos;
    if(totalMinutos <= 0) return alert("Debes ingresar al menos 1 minuto");
    const monto = calcularMonto(totalMinutos/60, mesas[index]);
    mostrarOpcionesPago(index, totalMinutos, monto);
}

function iniciarPreset(index, minutos){
    const monto = calcularMonto(minutos/60, mesas[index]);
    mostrarOpcionesPago(index, minutos, monto);
}

function mostrarOpcionesPago(index, minutos, monto){
    const html = `
        <p><strong>Precio:</strong> ${formatoBs(monto)} Bs</p>
        <button onclick="confirmarInicio(${index},${minutos},${monto},'Efectivo')" class="btn-efectivo">💵 Efectivo</button>
        <button onclick="confirmarInicio(${index},${minutos},${monto},'QR')" class="btn-qr">📱 QR</button>
    `;
    document.getElementById('contenidoModal').innerHTML = html;
}

function confirmarInicio(index, minutos, monto, metodo){
    if(!confirm(`Iniciar ${minutos} minutos por ${formatoBs(monto)} Bs`)) return;

    const mesa = mesas[index];
    mesa.estado = 'ocupada';
    mesa.tipo = 'tiempo';
    mesa.inicio = Date.now();
    mesa.fin = Date.now() + minutos * 60000;
    mesa.montoCobrado = monto;
    mesa.metodoPago = metodo;
    mesa.alarmaSonada = false;

    historial.unshift({
        mesa: mesa.nombre,
        inicio: new Date(),
        fin: new Date(mesa.fin),
        tiempo: `${Math.floor(minutos/60)}h ${minutos%60}min`,
        montoFinal: monto,
        metodo: metodo
    });

    guardarDatos();
    cerrarModal();
    renderMesas();
}

function iniciarIlimitado(index){
    const mesa = mesas[index];
    mesa.estado = 'ocupada';
    mesa.tipo = 'ilimitado';
    mesa.inicio = Date.now();
    guardarDatos();
    cerrarModal();
    renderMesas();
}

function cobrarIlimitado(index, metodo){
    const mesa = mesas[index];
    const tiempo = calcularTiempoJugado(mesa.inicio);
    const sugerido = calcularMonto(tiempo.horasDecimal, mesa);

    const html = `
        <p><strong>Tiempo jugado:</strong> ${tiempo.texto}</p>
        <input type="number" id="montoManual" value="${sugerido}" style="font-size:24px;text-align:center;width:100%;margin:10px 0;">
        <button onclick="confirmarCobroIlimitado(${index},'${metodo}')" class="btn-verde">✅ Confirmar Cobro</button>
    `;
    document.getElementById('contenidoModal').innerHTML = html;
}

function confirmarCobroIlimitado(index, metodo){
    const monto = parseFloat(document.getElementById('montoManual').value) || 0;
    const mesa = mesas[index];
    const tiempo = calcularTiempoJugado(mesa.inicio);

    historial.unshift({
        mesa: mesa.nombre,
        inicio: new Date(mesa.inicio),
        fin: new Date(),
        tiempo: tiempo.texto,
        montoFinal: monto,
        metodo: metodo
    });

    alert(`✅ Cobrado ${formatoBs(monto)} Bs`);
    liberarMesa(index);
}

function finalizarMesa(index){
    const mesa = mesas[index];
    alert(`✅ Mesa finalizada\nCobrado: ${formatoBs(mesa.montoCobrado)} Bs`);
    liberarMesa(index);
}

function liberarMesa(index){
    const mesa = mesas[index];
    mesa.estado = 'libre';
    mesa.tipo = null;
    mesa.inicio = null;
    mesa.fin = null;
    guardarDatos();
    cerrarModal();
    renderMesas();
}

function guardarConfig(){
    precioPorHora = parseFloat(document.getElementById('precioHora').value) || 50;
    precioPorHoraVIP = parseFloat(document.getElementById('precioHoraVIP').value) || 80;
    usarDecimales = document.getElementById('modoCobro').value === 'decimal';
    localStorage.setItem('precioHora', precioPorHora);
    localStorage.setItem('precioHoraVIP', precioPorHoraVIP);
    localStorage.setItem('usarDecimales', JSON.stringify(usarDecimales));
    alert("✅ Configuración guardada");
}

function agregarMesa(){
    const nombre = document.getElementById('nombreMesa').value.trim();
    if(!nombre) return alert("Escribe el nombre de la mesa");
    const tipoMesa = document.getElementById('tipoMesa').value;
    mesas.push({id: Date.now(), nombre, tipoMesa, estado: 'libre'});
    guardarDatos();
    renderMesas();
    document.getElementById('nombreMesa').value = '';
}

function eliminarMesa(index){
    if(confirm("¿Eliminar esta mesa?")){
        mesas.splice(index, 1);
        guardarDatos();
        renderMesas();
    }
}

function mostrarHistorial(){
    let total = historial.reduce((sum, item) => sum + (item.montoFinal || 0), 0);
    let html = `<p><strong>Total: ${formatoBs(total)} Bs</strong></p>`;
    if(historial.length === 0) html += "<p>No hay registros aún.</p>";
    
    historial.forEach(item => {
        html += `
            <div style="background:#1f1f1f;padding:12px;margin:8px 0;border-radius:10px;">
                <strong>${item.mesa}</strong><br>
                ${item.tiempo} — ${formatoBs(item.montoFinal)} Bs
            </div>`;
    });

    document.getElementById('modalTitulo').textContent = '📋 Historial';
    document.getElementById('contenidoModal').innerHTML = html;
    document.getElementById('modal').style.display = 'block';
}

function exportarControlDelDia(){
    alert("Control del día exportado (función lista para mejorar)");
}

function cerrarModal(){
    document.getElementById('modal').style.display = 'none';
}

// ==================== TIMERS ====================
function actualizarTimers(){
    let hayAlarma = false;
    mesas.forEach(mesa => {
        if(mesa.tipo==='tiempo' && mesa.fin && Date.now() >= mesa.fin && !mesa.alarmaSonada){
            mesa.alarmaSonada = true;
            hayAlarma = true;
        }
    });

    if(hayAlarma) playAlarm();
    else stopAlarm();

    renderMesas();
}

// ==================== INICIO ====================
window.onload = () => {
    setInterval(actualizarTimers, 1000);
};
</script>
</body>
</html>
