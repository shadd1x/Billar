<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎱 Billar Control</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0a0a0a, #1a1a1a); color: #fff; margin: 0; padding: 10px; }
    .container { max-width: 620px; margin: auto; }
    .header { text-align: center; margin: 20px 0 15px 0; }
    .bola8 { font-size: 92px; line-height: 1; margin-bottom: 8px; text-shadow: 0 0 30px #fff, 0 0 60px #e91e63; }

    .section { background: #1f1f1f; padding: 18px; margin: 15px 0; border-radius: 16px; }
    button { background: #e91e63; color: white; border: none; padding: 14px; margin: 8px 4px; border-radius: 12px; font-size: 17px; font-weight: 600; width: 100%; }
    .btn-rojo { background: #f44336; }
    .btn-verde { background: #4caf50; }
    .btn-azul { background: #2196f3; }
    .btn-naranja { background: #ff9800; }
    .btn-gris { background: #666; }

    input { padding: 14px; margin: 8px 0; width: 100%; border-radius: 12px; border: none; background: #333; color: white; font-size: 17px; }

    .mesa { background: #1f1f1f; padding: 16px; margin: 12px 0; border-radius: 14px; cursor: pointer; }
    .activa { background: #2e7d32 !important; border-left: 5px solid #4caf50; }

    .tiempo-restante { font-size: 19px; font-weight: bold; color: #ffeb3b; }
    .alarma { animation: parpadeo 800ms infinite; }
    @keyframes parpadeo { 50% { background: #f44336; } }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; }
    .modal-content { background: #222; margin: 8% auto; padding: 25px; width: 90%; max-width: 460px; border-radius: 16px; max-height: 90vh; overflow-y: auto; }
    .historial-item { background: #333; padding: 12px; margin: 10px 0; border-radius: 10px; font-size: 14.5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="bola8">🎱</div>
      <h1 class="title">BILLAR CONTROL</h1>
      <p style="color:#aaa;">La Paz • Bolivia</p>
    </div>

    <div class="section">
      <h2>Configuración</h2>
      <input type="number" id="precioHora" value="50" step="0.5">
      <button onclick="guardarConfig()">Guardar Precio</button>
    </div>

    <div class="section">
      <h2>Agregar Mesa</h2>
      <input type="text" id="nombreMesa" placeholder="Nombre de la mesa">
      <button onclick="agregarMesa()">+ Agregar Mesa</button>
    </div>

    <div class="section">
      <h2>Mesas</h2>
      <div id="listaMesas"></div>
    </div>

    <div style="display:flex; gap:8px;">
      <button onclick="mostrarHistorial()" class="btn-azul">📋 Historial</button>
      <button onclick="exportarControlDelDia()" class="btn-naranja">📅 Control del Día</button>
    </div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <h2 id="modalTitulo"></h2>
      <div id="contenidoModal"></div>
      <button onclick="cerrarModal()" class="btn-gris" style="margin-top:15px;">Cerrar</button>
    </div>
  </div>

  <script>
    let precioPorHora = 50;
    let mesas = [];
    let historial = [];

    function cargarDatos() {
      precioPorHora = parseFloat(localStorage.getItem('precioHora')) || 50;
      mesas = JSON.parse(localStorage.getItem('mesasBillar')) || [];
      historial = JSON.parse(localStorage.getItem('historialBillar')) || [];
      document.getElementById('precioHora').value = precioPorHora;
    }

    function calcularTiempoJugado(inicio) {
      const diff = Date.now() - inicio;
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      return {
        texto: `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`,
        horasDecimal: diff / 3600000
      };
    }

    function renderMesas() {
      const lista = document.getElementById('listaMesas');
      lista.innerHTML = '';
      
      mesas.forEach((mesa, index) => {
        const div = document.createElement('div');
        div.className = `mesa ${mesa.estado === 'ocupada' ? 'activa' : ''}`;
        let html = `<strong>${mesa.nombre}</strong><br>`;

        if (mesa.estado === 'ocupada') {
          if (mesa.tipo === 'tiempo' && mesa.fin) {
            const diff = mesa.fin - Date.now();
            const tiempo = diff > 0 
              ? `${Math.floor(diff/3600000).toString().padStart(2,'0')}:${Math.floor((diff%3600000)/60000).toString().padStart(2,'0')}:${Math.floor((diff%60000)/1000).toString().padStart(2,'0')}` 
              : "00:00:00";
            html += `<span class="tiempo-restante ${diff <= 0 ? 'alarma' : ''}">⏳ ${tiempo}</span>`;
          } else if (mesa.tipo === 'ilimitado') {
            const t = calcularTiempoJugado(mesa.inicio);
            html += `<span class="tiempo-restante">▶️ ${t.texto}</span>`;
          }
        } else {
          html += `<small>Libre</small>`;
        }

        html += `<br><button onclick="event.stopImmediatePropagation(); eliminarMesa(${index});" class="btn-rojo" style="padding:8px 12px; font-size:14px; margin-top:8px; width:auto;">Eliminar</button>`;
        div.innerHTML = html;
        div.addEventListener('click', () => abrirModalMesa(index));
        lista.appendChild(div);
      });
    }

    function abrirModalMesa(index) {
      const mesa = mesas[index];
      document.getElementById('modalTitulo').textContent = mesa.nombre;
      let html = '';

      if (mesa.estado === 'ocupada' && mesa.tipo === 'tiempo') {
        const monto = ((mesa.fin - mesa.inicio) / 3600000 * precioPorHora).toFixed(2);
        html = `<p>Total a cobrar: <strong>${monto} Bs</strong></p>
                <button onclick="finalizarTiempo(${index})" class="btn-verde">✅ Finalizar y Cobrar</button>`;
      } else if (mesa.estado === 'ocupada' && mesa.tipo === 'ilimitado') {
        const tiempo = calcularTiempoJugado(mesa.inicio);
        const totalBruto = (tiempo.horasDecimal * precioPorHora).toFixed(2);
        html = `
          <p><strong>Tiempo jugado:</strong> ${tiempo.texto}</p>
          <p><strong>Total bruto:</strong> ${totalBruto} Bs</p>
          <label>💰 Rebaja (Bs):</label>
          <input type="number" id="descuentoInput" value="0" step="0.5">
          <p><strong>Total a pagar:</strong> <span id="totalFinal">${totalBruto} Bs</span></p>
          <button onclick="calcularDescuento(${index})" class="btn-naranja">Calcular Rebaja</button>
          <button onclick="detenerIlimitado(${index})" class="btn-verde">✅ Cobrar y Liberar</button>
        `;
      } else {
        html = `
          <h3>Tiempo Fijo</h3>
          <input type="number" id="horasInput" value="1" style="width:48%;display:inline-block;">
          <input type="number" id="minutosInput" value="0" style="width:48%;display:inline-block;">
          <p id="precioCalculado" style="margin:10px 0; font-weight:bold; color:#4caf50;"></p>
          <button onclick="calcularPrecioYConfirmar(${index})" class="btn-verde">Ver Precio y Iniciar</button><br>
          <button onclick="iniciarIlimitado(${index})">♾️ Tiempo Ilimitado</button>
        `;
      }

      document.getElementById('contenidoModal').innerHTML = html;
      document.getElementById('modal').style.display = 'block';
    }

    // Mostrar precio calculado en tiempo fijo
    function calcularPrecioYConfirmar(index) {
      const horas = parseFloat(document.getElementById('horasInput').value) || 0;
      const minutos = parseFloat(document.getElementById('minutosInput').value) || 0;
      const totalHoras = (horas * 60 + minutos) / 60;
      const monto = (totalHoras * precioPorHora).toFixed(2);
      
      document.getElementById('precioCalculado').textContent = `Total a cobrar: ${monto} Bs`;
      
      if (confirm(`¿Iniciar tiempo fijo por ${horas}h ${minutos}min?\nTotal: ${monto} Bs`)) {
        iniciarTiempoFijo(index);
      }
    }

    function iniciarTiempoFijo(index) {
      const horas = parseFloat(document.getElementById('horasInput').value) || 0;
      const minutos = parseFloat(document.getElementById('minutosInput').value) || 0;
      if (horas + minutos <= 0) return alert("Tiempo inválido");

      const mesa = mesas[index];
      mesa.estado = 'ocupada';
      mesa.tipo = 'tiempo';
      mesa.inicio = Date.now();
      mesa.fin = Date.now() + (horas*60 + minutos)*60000;

      localStorage.setItem('mesasBillar', JSON.stringify(mesas));
      cerrarModal();
      renderMesas();
    }

    // Alarma cuando termina tiempo fijo
    function actualizarTimers() {
      let alarmaActiva = false;
      mesas.forEach(mesa => {
        if (mesa.tipo === 'tiempo' && mesa.fin && Date.now() >= mesa.fin && !mesa.alarmaSonada) {
          mesa.alarmaSonada = true;
          alarmaActiva = true;
        }
      });

      if (alarmaActiva) {
        if (navigator.vibrate) navigator.vibrate([500, 300, 500, 300, 800]);
        alert("⏰ ¡TIEMPO TERMINADO EN UNA MESA!");
      }
      renderMesas();
    }

    function finalizarTiempo(index) {
      const mesa = mesas[index];
      const monto = ((mesa.fin - mesa.inicio) / 3600000 * precioPorHora).toFixed(2);
      const metodo = confirm("¿Pagó en EFECTIVO?\n\nOK = Efectivo\nCancelar = QR") ? "Efectivo" : "QR";

      historial.unshift({
        mesa: mesa.nombre,
        inicio: new Date(mesa.inicio),
        fin: new Date(mesa.fin),
        tiempo: calcularTiempoJugado(mesa.inicio).texto,
        montoFinal: parseFloat(monto),
        metodo: metodo
      });

      localStorage.setItem('historialBillar', JSON.stringify(historial));
      alert(`✅ Cobrado: ${monto} Bs (${metodo})`);
      liberarMesa(index);
    }

    function detenerIlimitado(index) {
      const mesa = mesas[index];
      const tiempo = calcularTiempoJugado(mesa.inicio);
      const totalBruto = tiempo.horasDecimal * precioPorHora;
      const descuento = parseFloat(document.getElementById('descuentoInput')?.value) || 0;
      const montoFinal = Math.max(0, totalBruto - descuento);
      const metodo = confirm("¿Pagó en EFECTIVO?\n\nOK = Efectivo\nCancelar = QR") ? "Efectivo" : "QR";

      historial.unshift({
        mesa: mesa.nombre,
        inicio: new Date(mesa.inicio),
        fin: new Date(),
        tiempo: tiempo.texto,
        montoFinal: parseFloat(montoFinal.toFixed(2)),
        metodo: metodo
      });

      localStorage.setItem('historialBillar', JSON.stringify(historial));
      alert(`✅ ${mesa.nombre}\nTiempo: ${tiempo.texto}\nCobrado: ${montoFinal.toFixed(2)} Bs (${metodo})`);
      liberarMesa(index);
    }

    function liberarMesa(index) {
      const mesa = mesas[index];
      mesa.estado = 'libre';
      mesa.tipo = null;
      mesa.inicio = null;
      mesa.fin = null;
      mesa.alarmaSonada = false;
      localStorage.setItem('mesasBillar', JSON.stringify(mesas));
      cerrarModal();
      renderMesas();
    }

    // Historial
    function mostrarHistorial() {
      let html = `<h3>📋 Historial Completo</h3>`;
      if (historial.length === 0) {
        html += `<p>Aún no hay sesiones registradas.</p>`;
      } else {
        let totalDia = 0;
        const hoy = new Date().toISOString().slice(0,10);

        historial.forEach(item => {
          if (item.inicio.toISOString().slice(0,10) === hoy) totalDia += item.montoFinal || 0;
          html += `
            <div class="historial-item">
              <strong>${item.mesa}</strong><br>
              ${item.inicio.toLocaleString('es-BO')} → ${item.fin.toLocaleString('es-BO')}<br>
              Tiempo: ${item.tiempo} | <strong>${item.montoFinal.toFixed(2)} Bs</strong><br>
              <small>${item.metodo}</small>
            </div>`;
        });
        html += `<hr><h3>Total Hoy: <strong>${totalDia.toFixed(2)} Bs</strong></h3>`;
      }
      document.getElementById('modalTitulo').textContent = "Historial";
      document.getElementById('contenidoModal').innerHTML = html;
      document.getElementById('modal').style.display = 'block';
    }

    function exportarControlDelDia() {
      const hoy = new Date().toISOString().slice(0,10);
      const delDia = historial.filter(item => item.inicio.toISOString().slice(0,10) === hoy);
      if (delDia.length === 0) return alert("No hay sesiones hoy");

      let csv = "Mesa,Inicio,Fin,Tiempo,Monto,Método\n";
      delDia.forEach(item => {
        csv += `"${item.mesa}","${item.inicio.toLocaleString()}","${item.fin.toLocaleString()}","${item.tiempo}",${item.montoFinal},"${item.metodo}"\n`;
      });

      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Control_Dia_${hoy}.csv`;
      a.click();
    }

    function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
    function guardarConfig() {
      precioPorHora = parseFloat(document.getElementById('precioHora').value) || 50;
      localStorage.setItem('precioHora', precioPorHora);
      alert('Precio guardado');
    }
    function agregarMesa() {
      const nombre = document.getElementById('nombreMesa').value.trim();
      if (!nombre) return alert("Escribe el nombre");
      mesas.push({id: Date.now(), nombre, estado: 'libre'});
      localStorage.setItem('mesasBillar', JSON.stringify(mesas));
      renderMesas();
      document.getElementById('nombreMesa').value = '';
    }
    function eliminarMesa(index) {
      if (confirm("¿Eliminar mesa?")) {
        mesas.splice(index, 1);
        localStorage.setItem('mesasBillar', JSON.stringify(mesas));
        renderMesas();
      }
    }

    window.onload = () => {
      cargarDatos();
      renderMesas();
      setInterval(actualizarTimers, 1000);
    };
  </script>
</body>
</html>
